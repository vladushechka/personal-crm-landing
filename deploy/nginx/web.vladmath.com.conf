# Landing: static files, deployed from github.com/vladushechka/personal-crm-landing
#
# Copy of /etc/nginx/sites-available/web.vladmath.com on the server, kept here for history.
# The server file is the live one: change it there (sudo nginx -t, then reload), then update this copy.
# The nginx version is hidden server-wide by /etc/nginx/conf.d/10-server-tokens.conf (server_tokens off).
server {
    server_name web.vladmath.com;

    root /var/www/web.vladmath.com;
    index index.html;

    # Security headers. "always" adds them to every response, 404 included.
    # They apply to every location below only while no location has its own add_header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # No nonce: inline scripts and styles are allowed, the page stays as built.
    # Google Fonts: CSS from fonts.googleapis.com, font files from fonts.gstatic.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vladmath-crm/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vladmath-crm/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = web.vladmath.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name web.vladmath.com;
    return 404; # managed by Certbot


}
